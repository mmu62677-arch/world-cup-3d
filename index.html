<!DOCTYPE html>  <html lang="es">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">  
<title>World Cup Football</title>  
<style>  
body {  
  margin: 0;  
  background: #123;  
  color: white;  
  text-align: center;  
  font-family: Arial;  
}  
h2 { background: #071b14; padding: 15px; }  
canvas {  
  width: 100%;  
  background: #25834b;  
  touch-action: none;  
}  
button {  
  font-size: 22px;  
  padding: 13px;  
  margin: 4px;  
  border-radius: 10px;  
}  
</style>  
</head>  
<body>  
<h2>🏆 WORLD CUP FOOTBALL</h2>  
<h2 id="score">MÉXICO 🇲🇽 0 - 0 RIVAL 🌎</h2>  
<canvas id="game" width="800" height="450"></canvas>  
<div>  
<button onclick="move(0,-1)">⬆️</button>  
<button onclick="move(-1,0)">⬅️</button>  
<button onclick="move(0,1)">⬇️</button>  
<button onclick="move(1,0)">➡️</button>  
<button onclick="shoot()">⚽ TIRAR</button>  
</div>  
<script>  
const c=document.getElementById("game");  
const ctx=c.getContext("2d");  
let p={x:180,y:225};  
let r={x:620,y:225};  
let b={x:220,y:225,vx:0,vy:0};  
let goals=[0,0];  function move(a,d){
p.x=Math.max(30,Math.min(770,p.x+a25));
p.y=Math.max(30,Math.min(420,p.y+d25));
}

function shoot(){
let dx=b.x-p.x,dy=b.y-p.y;
if(Math.hypot(dx,dy)<110){
b.vx=12;
b.vy=(225-b.y)*0.04;
}
}

function draw(){
ctx.clearRect(0,0,800,450);
ctx.fillStyle="#25834b";
ctx.fillRect(0,0,800,450);
ctx.strokeStyle="white";
ctx.lineWidth=4;
ctx.strokeRect(15,15,770,420);
ctx.beginPath();
ctx.moveTo(400,15);
ctx.lineTo(400,435);
ctx.stroke();
ctx.beginPath();
ctx.arc(400,225,65,0,7);
ctx.stroke();

ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(p.x,p.y,20,0,7);
ctx.fill();

ctx.fillStyle="blue";
ctx.beginPath();
ctx.arc(r.x,r.y,20,0,7);
ctx.fill();

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(b.x,b.y,11,0,7);
ctx.fill();

r.x+=(b.x-r.x)*0.012;
r.y+=(b.y-r.y)*0.012;

b.x+=b.vx;
b.y+=b.vy;
b.vx*=0.98;
b.vy*=0.98;

if(b.x>790 && b.y>170 && b.y<280){
goals[0]++;
reset();
}
if(b.x<10 && b.y>170 && b.y<280){
goals[1]++;
reset();
}

if(b.y<20 || b.y>430) b.vy*=-0.8;
if(b.x<10 || b.x>790) b.vx*=-0.8;

document.getElementById("score").textContent=
"MÉXICO 🇲🇽 "+goals[0]+" - "+goals[1]+" RIVAL 🌎";

requestAnimationFrame(draw);
}

function reset(){
b.x=400;
b.y=225;
b.vx=0;
b.vy=0;
p.x=180;
p.y=225;
}

draw();
</script>

</body>  
</html>
